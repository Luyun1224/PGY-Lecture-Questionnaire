<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>急救模組課程成效儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  /* 深紅 × 墨黑 × 奶油 × 便利貼黃（--navy 沿用為深色系角色＝墨黑） */
  --red:#8E1620; --red-d:#6B0F18; --navy:#1A1414; --navy-d:#000;
  --paper:#F6EDDC; --cream:#F5D547; --card:#FFFCF6; --line:#1A1414; --grid:#E9DDC8; --ink:#1A1414; --muted:#6B5E58; --soft:#F3E8D4;
  --yellow:#F5D547; --yellow-l:#FCEBA6;
  --pre:#1A1414; --post:#8E1620; --bar:#8E1620;
  --up:#1F7A4D; --down:#C21F2C;
  --gap:14px; --r:8px; --sh:5px 5px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper) radial-gradient(rgba(26,20,20,.10) 1px,transparent 1.3px) 0 0/18px 18px;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55;font-size:14.5px}
button,select,input{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.num{font-family:"Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ===== mosaic grid ===== */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);grid-auto-flow:row dense}
.tile{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;min-width:0;overflow:hidden}
.t-2{grid-column:span 2}.t-3{grid-column:span 3}.t-4{grid-column:span 4}.t-6{grid-column:span 6}.t-8{grid-column:span 8}.t-12{grid-column:span 12}
.r-2{grid-row:span 2}
.tile.navy{background:var(--navy);color:#fff}
.tile.red{background:var(--red);color:#fff}
.tile.cream{background:var(--cream)}
.tile.navy .l,.tile.navy .s{color:#D9CFCB}
.tile.cream .l,.tile.cream .s,.tile.cream .muted,.tile.cream .tile-h .d{color:#4A3F3A}
.tile.red .l,.tile.red .s{color:#FFDCD8}
.tile-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.tile-h h3{font-size:16px;font-weight:900;color:var(--ink);letter-spacing:.02em;line-height:1.4}
.tile.navy .tile-h h3,.tile.red .tile-h h3{color:#fff}
.tile-h .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile.navy .tile-h .d{color:#D9CFCB}
.tile.red .tile-h .d{color:#FFDCD8}
.tag-no{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--red);display:block;margin-bottom:2px}
.tile.cream .tag-no{color:var(--red-d)}
.tile.red .tag-no{color:var(--yellow);opacity:1}
.tile.navy .tag-no{color:var(--yellow)}
.empty{color:var(--muted);font-size:13.5px;padding:18px 0;text-align:center}

/* header mosaic */
header.wrap{padding-top:16px}
.head .title-tile{background:var(--red) radial-gradient(rgba(0,0,0,.16) 1px,transparent 1.3px) 0 0/14px 14px;color:#fff;min-height:188px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 24px}
.head .title-tile > svg{position:absolute;inset:0;width:100%;height:100%}
.head .title-tile > span,.head .title-tile > h1{position:relative}
.kicker{font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.22em;font-size:13px;text-transform:uppercase;color:var(--ink);display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding-bottom:6px;border-bottom:2.5px solid var(--ink)}
.head h1{font-weight:900;font-size:clamp(28px,4.4vw,42px);line-height:1.15;letter-spacing:.02em;margin-top:12px;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.head .sticker{position:relative;align-self:flex-start;margin-top:12px;font-weight:900;font-size:13.5px;color:var(--ink);background:var(--yellow);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:1px 10px;transform:rotate(-3deg)}
.head .meta-tile{background:var(--navy);color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.head .meta-tile .l{font-size:12.5px;color:var(--yellow);font-weight:700;letter-spacing:.06em}
.head .meta-tile .v{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600;line-height:1.2}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .full{grid-column:1/-1}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:2px solid currentColor;background:transparent;color:inherit;border-radius:6px;padding:8px 12px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s}
.meta-tile .btn{color:#fff;border-color:rgba(255,255,255,.55)}
.meta-tile .btn:hover{background:rgba(255,255,255,.1)}
.meta-tile .btn.red{background:var(--yellow);border-color:var(--yellow);color:var(--ink);box-shadow:3px 3px 0 var(--red)}
.meta-tile .btn.red:hover{background:#fff;border-color:#fff}

/* nav tile */
.navbar{position:sticky;top:0;z-index:30;padding:var(--gap) 0 calc(var(--gap) + 5px);background:linear-gradient(var(--paper) 85%,transparent)}
.navbar .tile{padding:8px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 100%;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:2px solid transparent;background:transparent;color:var(--muted);font-size:14px;font-weight:700;padding:7px 14px;cursor:pointer;border-radius:6px;white-space:nowrap;transition:all .15s}
.tabs button:hover{color:var(--ink);background:var(--yellow-l)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:2px 2px 0 var(--red)}
.tabs button.on.alt{background:var(--red);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:6px 6px 2px;border-top:2px dashed var(--grid);flex:1 1 100%}
.filters label{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.filters input,.filters select{border:2px solid var(--ink);background:#fff;border-radius:6px;padding:5px 8px;font-size:13px;color:var(--ink)}

main.wrap{padding-bottom:40px}

/* KPI tiles */
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:40px;line-height:1.05;margin-top:6px;white-space:nowrap}
.kpi .v small{font-size:17px;font-weight:600;margin:0 2px;opacity:.7}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.delta{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--muted)}
.tile.navy .delta,.tile.red .delta{color:#fff}

/* module tiles */
.mod{cursor:pointer;border:0;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;justify-content:space-between;gap:14px;transition:transform .15s,box-shadow .15s}
.mod:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.mod .nm{font-size:17px;font-weight:900;line-height:1.3}
.mod .sb{font-size:12.5px;color:var(--muted)}
.tile.navy.mod .sb,.tile.red.mod .sb{color:inherit;opacity:.72}
.mod .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mod .stats div{font-size:11.5px;font-weight:700}
.mod .stats div,.mod .big2 div{color:var(--muted)}
.tile.navy.mod .stats div,.tile.navy.mod .big2 div{color:#D9CFCB}
.tile.cream.mod .stats div,.tile.cream.mod .big2 div,.tile.cream.mod .sb{color:#4A3F3A}
.tile.red.mod .stats div,.tile.red.mod .big2 div{color:#FFDCD8}
.mod .stats .num{display:block;font-size:26px;line-height:1.15;font-weight:700;color:var(--ink)}
.tile.navy.mod .num,.tile.red.mod .num{color:#fff}
.mod .go{font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:700;letter-spacing:.14em}
.mod.big .nm{font-size:26px}
.mod.big .hero{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mod.big .hero .num{font-size:42px;display:block;line-height:1.05;white-space:nowrap}
.mod.big .hero div{font-size:12.5px;opacity:.85;font-weight:700}
.mod.big .stats{border-top:1px solid rgba(255,255,255,.18);padding-top:12px}

/* horizontal bars */
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;gap:10px}
.hb-row{display:grid;grid-template-columns:140px 1fr 86px;align-items:center;gap:10px}
.hb-lab{font-size:13px;line-height:1.35}
.hb-track{position:relative;display:grid;gap:2px;padding:2px 0;background:linear-gradient(to right,var(--grid) 1px,transparent 1px) 0 0/20% 100% repeat-x}
.tile.cream .hb-track{background:linear-gradient(to right,rgba(26,20,20,.22) 1px,transparent 1px) 0 0/20% 100% repeat-x}
.hb-track::after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--grid)}
.hb-bar{height:14px;border-radius:0 4px 4px 0;background:var(--bar);min-width:2px;position:relative;z-index:1;cursor:default}
.hb-bar.pre{background:var(--pre);height:11px}
.hb-bar.post{background:var(--post);height:11px}
.hb-bar:hover{filter:brightness(1.18)}
.hb-val{font-size:13px;text-align:right;line-height:1.3}
.hb-val .num{font-size:16px;font-weight:700}
.hb-val .p{display:block;font-size:11px;color:var(--muted)}
.hb-axis{display:grid;grid-template-columns:140px 1fr 86px;gap:10px;margin-top:4px}
.hb-axis div:nth-child(2){position:relative;height:16px}
.hb-axis span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.hb-axis span:first-child{transform:none}
.hb-axis span:last-child{transform:translateX(-100%)}

/* stacked */
.stk{display:grid;gap:12px}
.stk-row{display:grid;grid-template-columns:44px 1fr 48px;gap:10px;align-items:center}
.stk-lab{font-size:13px;font-weight:700;color:var(--ink)}
.stk-bar{display:flex;gap:2px;height:28px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--ink)}
.stk-bar div{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;overflow:hidden;cursor:default}
.stk-bar div:first-child{border-radius:6px 0 0 6px}
.stk-bar div:last-child{border-radius:0 6px 6px 0}
.stk-bar div:only-child{border-radius:6px}
.stk-n{font-size:12px;color:var(--muted);text-align:right}
.epa-leg{display:grid;gap:4px;margin-top:14px;font-size:12px;color:var(--muted)}
.epa-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.06)}

/* mini stats */
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini div{font-size:12px;font-weight:700;opacity:.8}
.mini .num{display:block;font-size:32px;line-height:1.1;opacity:1}
.mini .num small{font-size:14px;opacity:.7;margin-left:2px}

/* tables */
.tbl-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tbl-tools input{border:2px solid var(--ink);border-radius:6px;padding:6px 10px;font-size:13.5px;min-width:180px;flex:1;max-width:300px}
.seg{display:inline-flex;background:var(--soft);border:2px solid var(--ink);border-radius:8px;padding:2px;gap:2px;flex:none}
.seg button{border:0;background:transparent;color:var(--ink);padding:4px 12px;font-size:13px;font-weight:700;cursor:pointer;border-radius:5px}
.seg button.on{background:var(--navy);color:#fff}
.seg button.on.alt{background:var(--red)}
.upd{font-size:12px;color:var(--muted)}
.tbl-scroll{overflow-x:auto;border-radius:6px;border:2px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--ink);color:#fff;font-weight:700;text-align:left;padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--grid);white-space:nowrap}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
tbody tr:hover{background:var(--yellow-l)}
tbody tr.click{cursor:pointer}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:4px;padding:0 7px;color:#fff}
.pill.pre{background:var(--navy)} .pill.post{background:var(--red)}

/* qualitative */
.qsel{width:100%;border:2px solid var(--ink);border-radius:6px;padding:8px 10px;font-size:13.5px;background:#fff;margin-bottom:10px;color:var(--ink)}
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;max-height:520px;overflow:auto}
.quote{padding:12px 14px;background:var(--soft);border:2px solid var(--ink);border-radius:6px;display:flex;flex-direction:column;gap:6px}
.quote:nth-child(5n+2){background:#FFF1BF}
.quote:nth-child(5n+4){background:#F7E1DF}
.quote .txt{font-size:13.5px;white-space:pre-wrap;word-break:break-word;flex:1}
.quote .who{font-size:12px;font-weight:700;color:var(--red)}
.quote .who span{font-weight:500;color:var(--muted);margin-left:6px}

.loading{text-align:center;color:var(--muted);padding:60px 0}

/* modal */
.modal{position:fixed;inset:0;background:rgba(26,20,20,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--card);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);border-radius:8px;max-width:720px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;background:var(--red);color:#fff;border-bottom:3px solid var(--ink)}
.modal-h b{font-size:17px}
.modal-h span{display:block;font-size:12.5px;color:#FFDCD8}
.modal-h button{border:0;background:transparent;font-size:24px;color:#fff;cursor:pointer;line-height:1}
.modal-b{overflow:auto;padding:8px 20px 20px}
.qa{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;padding:10px 0;border-bottom:1px solid var(--grid)}
.qa .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--red)}
.qa .q{font-size:13px;color:var(--muted)}
.qa .a{grid-column:2;font-size:14px;font-weight:500;white-space:pre-wrap}

/* insights */
.insight{margin-top:14px;padding:12px 14px;background:var(--soft);border:2px dashed rgba(26,20,20,.35);border-radius:6px;font-size:13.5px;line-height:1.75;color:var(--ink)}
.tile.cream .insight{background:rgba(255,255,255,.75)}
.tile.navy .insight{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3);color:#fff}
.ins-tag{display:inline-block;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);font-size:12px;font-weight:900;border-radius:3px;transform:rotate(-2deg);padding:1px 9px;margin-bottom:6px}
.tile.navy .ins-tag{border-color:var(--yellow)}
.insight ul{margin:0;padding-left:18px}
.insight li{margin:2px 0}
.insight b{color:var(--red)}
.tile.navy .insight b{color:#fff}
.ins-tile{padding:6px 8px}
.ins-tile .insight{margin:0;background:transparent;border:0}
/* qualitative blocks */
.qblock{border-top:1px solid var(--grid);padding:12px 0}
.qblock:first-of-type{border-top:0;padding-top:0}
.qblock summary{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;cursor:pointer;list-style:none}
.qblock summary::-webkit-details-marker{display:none}
.qno{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;color:var(--red)}
.qtx{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.5}
.qmeta{font-size:12.5px;color:var(--muted);white-space:nowrap}
.qblock:not([open]) .qmeta::after{content:"　展開 ▾"}
.qthemes{font-size:12.5px;color:var(--muted);margin:8px 0 10px 42px}
.qblock .quotes{max-height:none;overflow:visible;margin-left:42px}
.qblock .insight{margin-left:42px}
mark{background:var(--yellow-l);color:inherit;border-radius:3px;padding:0 1px}
@media (max-width:640px){.qthemes,.qblock .quotes,.qblock .insight{margin-left:0}}
/* year-to-date heroes */
.hero-tile{display:flex;flex-direction:column;justify-content:space-between;min-height:170px}
.hero-tile .l{font-size:12.5px;font-weight:700}
.hero-big{font-weight:700;font-size:84px;line-height:.95;margin:10px 0 6px;letter-spacing:-.01em}
.hero-big small{font-size:24px;font-weight:600;margin-left:6px;opacity:.75;letter-spacing:0}
.hero-cap{font-size:13.5px;font-weight:700}
.tile.navy .hero-cap{color:#EDE5E1}.tile.red .hero-cap{color:#FFE9E6}.tile.cream .hero-cap{color:var(--ink)}
.mod .big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod .big2 div{font-size:13px;font-weight:700}
.mod .big2 .num{display:block;font-size:64px;line-height:1;font-weight:700;margin-bottom:4px;color:var(--red)}
.tile.navy.mod .big2 .num,.tile.red.mod .big2 .num{color:#fff}
.tile.cream.mod .big2 .num{color:var(--ink)}
.mod .stats{border-top:1px solid rgba(127,127,127,.22);padding-top:10px}
.mod .stats .num{font-size:20px}
.ytd-note{padding:12px 20px;font-size:13.5px;color:var(--muted)}
.ytd-note b{color:var(--red);font-size:15px}
@media (max-width:640px){.hero-big{font-size:60px}.hero-tile{min-height:140px}.mod .big2 .num{font-size:48px}}
/* tracking */
.trk-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.trk-bar label{font-size:12.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.trk-bar select{border:2px solid var(--ink);border-radius:6px;padding:5px 8px;font-size:13px;background:#fff}
.meter-row{display:grid;grid-template-columns:1fr 44px 52px;align-items:center;gap:8px}
.meter{height:12px;background:#fff;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--red)}
.meter-row b{font-size:15px;text-align:right}
.meter-row span{font-size:12px;text-align:right}
tr.sel td{background:var(--yellow-l)}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.ok{background:#DCEFE2;color:#1F5A3A}
.chip.no{background:#F7E1DF;color:var(--red)}
.chip small{font-size:10.5px;font-weight:700;opacity:.8}
.orph{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
select.trk,input.trk-note{border:2px solid var(--ink);border-radius:6px;padding:4px 8px;font-size:12.5px;background:#fff;font-family:inherit}
input.trk-note{min-width:140px}
.btn.sms{padding:4px 10px;font-size:12.5px;color:var(--red);border-width:2px}
.btn.sms:hover{background:#F7E1DF}
.btn.sms.over{color:#fff;background:var(--red);border-color:var(--red)}
.sms-cfg{margin-top:12px;padding-top:12px;border-top:2px dashed var(--ink);display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px 18px}
.sms-cfg .row{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.sms-cfg .row b{font-size:13px}
.sms-cfg .row .ln{display:flex;gap:6px;align-items:center}
.sms-cfg input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:6px;padding:4px 8px;font-size:12.5px;background:#fff;font-family:inherit}
.sms-cfg .full{color:var(--muted);font-size:11.5px;word-break:break-all}
.sms-cfg .ok{color:var(--up)}.sms-cfg .warn{color:var(--down)}
#flash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:6px;border:2px solid var(--yellow);font-size:13.5px;font-weight:700;opacity:0;transition:all .2s;z-index:70;pointer-events:none}
#flash.on{opacity:1;transform:translateX(-50%)}

/* paired t-test (two-sided) */
function betacf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;
  for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;
  aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-7)break;}return h;}
function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x);}
function betai(a,b,x){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;}
function pairedT(diffs){const n=diffs.length;if(n<2)return {n,p:null};const m=mean(diffs),s=sd(diffs);if(!s)return {n,m,p:m===0?1:0};const t=m/(s/Math.sqrt(n)),df=n-1;return {n,m,t,df,p:betai(df/2,.5,df/(df+t*t))};}
const pTxt=p=>p==null?'':p<.001?'p < .001':'p = '+p.toFixed(3).replace(/^0/,'');

async function load(){

  $('#upd').textContent='讀取中…';

    if(!j.ok) throw new Error(j.error||'讀取失敗');

function prepare(){

    DATA[f.key]=(src.rows||[]).map(row=>{
      const r={get:h=>get(row,h),time:String(get(row,'完成時間')||get(row,'開始時間')||''),name:clean(get(row,'姓名')),id:clean(get(row,'人事號')).toUpperCase(),rank:clean(get(row,'職級'))};

    }).filter(r=>r.name||r.id);
  });
  prepareCheckin();
  const sel=$('#fRank'),cur=sel.value;
  sel.innerHTML='<option value="">全部</option>'+[...ranks].sort().map(r=>`<option>${esc(r)}</option>`).join('');

function prepareCheckin(){
  const c=RAW.checkin||{headers:[],rows:[]}, idx={};
  (c.headers||[]).forEach((h,i)=>{const k=norm(h);if(!(k in idx))idx[k]=i;});
  const g=(row,h)=>{const i=idx[norm(h)];return i==null?'':row[i];};
  CHK=(c.rows||[]).map(row=>({date:dateOf(g(row,'上課日期'))||dateOf(g(row,'完成時間')),course:courseOf(g(row,'此次課程主題')),name:clean(g(row,'姓名')),id:clean(g(row,'人事號')).toUpperCase(),unit:clean(g(row,'單位')),time:String(g(row,'完成時間')||'')}))
    .filter(r=>r.date&&(r.name||r.id));
  TRK={}; ((RAW.track||{}).rows||[]).forEach(r=>{TRK[String(r[0])]={status:String(r[5]||''),note:String(r[6]||''),updated:String(r[7]||'')};});
  // sessions
  const map=new Map();
  CHK.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.time<b.time?-1:1).forEach(r=>{
    const k=r.date+'|'+r.course.key;
    if(!map.has(k)) map.set(k,{key:k,date:r.date,course:r.course,att:[],orph:{}});
    const s=map.get(k), pid=r.id||r.name;
    if(s.att.some(a=>(a.id||a.name)===pid)) return;
    const key=`${r.date}|${r.course.key}|${pid}`;
    s.att.push({...r,key,done:{},trk:TRK[key]||{}});
  });
  SESS=[...map.values()];
  // match questionnaires → attendees (each response used once, nearest date wins)
  const used=new Set();
  SESS.forEach(s=>s.course.forms.forEach(fk=>{const [lo,hi]=win(fk,s.date);
    s.att.forEach(a=>{
      const pool=(DATA[fk]||[]).filter(r=>!used.has(r)&&r.date>=lo&&r.date<=hi);
      let c=pool.filter(r=>a.id&&r.id===a.id); if(!c.length) c=pool.filter(r=>a.name&&r.name===a.name);
      if(!c.length) return;
      c.sort((x,y)=>Math.abs(dayDiff(s.date,x.date))-Math.abs(dayDiff(s.date,y.date)));
      a.done[fk]=c[0]; used.add(c[0]);
    });}));
  // late responses (e.g. after an SMS reminder) → the same person's most recent session of that course still missing this form
  FORMS.forEach(f=>(DATA[f.key]||[]).filter(r=>!used.has(r)&&r.date).sort((x,y)=>x.date<y.date?-1:1).forEach(r=>{
    let best=null;
    SESS.filter(s=>s.course.forms.includes(f.key)&&s.date<=r.date).forEach(s=>s.att.forEach(a=>{
      if(a.done[f.key]) return;
      const hit=(r.id&&a.id&&r.id===a.id)||(r.name&&a.name&&r.name===a.name);
      if(hit&&(!best||s.date>best.s.date)) best={s,a};
    }));
    if(best){best.a.done[f.key]={...r,late:dayDiff(best.s.date,r.date)};used.add(r);}
  }));
  // responses without a sign-in → nearest session of that course
  FORMS.forEach(f=>(DATA[f.key]||[]).filter(r=>!used.has(r)&&r.date).forEach(r=>{
    let best=null; SESS.filter(s=>s.course.forms.includes(f.key)).forEach(s=>{const [lo,hi]=win(f.key,s.date);if(r.date>=lo&&r.date<=hi&&(!best||Math.abs(dayDiff(s.date,r.date))<Math.abs(dayDiff(best.date,r.date))))best=s;});
    if(best)(best.orph[f.key]=best.orph[f.key]||[]).push(r);
  }));
  ATT={}; SESS.forEach(s=>s.att.forEach(a=>ATT[a.key]={a,s}));
}

/* ---------- 自動觀察（依當下資料產生） ---------- */
const pc=x=>x==null?'–':Math.round(x*100)+'%';
function insight(lines){lines=lines.filter(Boolean);if(!lines.length)return '';return `<div class="insight"><span class="ins-tag">觀察</span><ul>${lines.map(l=>`<li>${l}</li>`).join('')}</ul></div>`;}
const smallN=n=>n>0&&n<10?`樣本數僅 ${n} 份，解讀宜保守，建議累積更多梯次再下結論。`:'';
function insHero(courseKey){
  const y=yearStats(courseKey), L=[];
  if(!y.sessions) return insight([`${THIS_YEAR} 年目前尚無簽到紀錄。`]);
  L.push(`${THIS_YEAR} 年至今共開課 <b>${y.sessions} 場</b>、訓練 <b>${y.headcount} 人次</b>，平均每場 ${fmt(y.headcount/y.sessions,1)} 人；不重複學員 ${y.unique} 人${y.headcount>y.unique?`（有 ${y.headcount-y.unique} 人次為重複參訓）`:''}。`);
  if(y.headcount) L.push(`學員組成以 ${y.pgy>=y.ugy?'PGY':'UGY'} 為主（PGY ${pc(y.pgy/y.headcount)}、UGY ${pc(y.ugy/y.headcount)}）。`);
  if(y.rate!=null){
    const lvl=y.rate>=.8?'回收狀況良好':y.rate>=.6?'回收尚可，仍有提升空間':'回收率偏低，建議至「簽到與回收」追蹤未填學員';
    L.push(`問卷回收率 <b>${pc(y.rate)}</b>（${y.got}/${y.need} 份），${lvl}。`);
  }else L.push('本課程僅簽到，不需填寫問卷。');
  return insight(L);
}
function insSelf(rs,its,isSat){
  if(!rs.length) return '';
  const st=its.map(it=>({k:it.k,...itemStat(rs,it)})).filter(s=>s.mean!=null);
  if(!st.length) return '';
  const all=mean(st.map(s=>s.mean)), hi=[...st].sort((a,b)=>b.mean-a.mean)[0], lo=[...st].sort((a,b)=>a.mean-b.mean)[0];
  const weak=st.filter(s=>s.mean<3.5), L=[];
  L.push(`${isSat?'滿意度':'自評'}各題平均 <b>${fmt(all)}</b> 分；最高為「${hi.k}」（${fmt(hi.mean)}），最低為「${lo.k}」（${fmt(lo.mean)}）。`);
  if(isSat){const t=mean(st.map(s=>s.top2));L.push(`平均有 ${pc(t)} 學員給予「滿意」以上評價${t>=.9?'，整體評價相當正向':t<.7?'，部分學員評價保留，可參考質性回饋':''}。`);}
  else if(weak.length) L.push(`低於 3.5 分的題目：${weak.map(s=>`「${s.k}」`).join('、')}，屬學員自覺較沒把握的能力，可作為下一梯次教學加強重點。`);
  else L.push('各題皆在 3.5 分以上，學員對各項能力普遍具信心。');
  L.push(smallN(rs.length));
  return insight(L);
}
function insPair(stats,tS,aS,bS,pairOnly){
  const v=stats.filter(s=>s.pre!=null&&s.post!=null); if(!v.length) return '';
  const L=[], d=s=>s.post-s.pre;
  if(pairOnly){
    const sig=v.filter(s=>s.p!=null&&s.p<.05&&d(s)>0), ns=v.filter(s=>!(s.p!=null&&s.p<.05));
    L.push(`配對學員課後整體自評由 ${fmt(aS)} 提升至 <b>${fmt(bS)}</b>（${d({pre:aS,post:bS})>=0?'+':''}${fmt(bS-aS)}，${pTxt(tS.p)}）${tS.p!=null&&tS.p<.05?'，課程對自覺能力有顯著提升':''}。`);
    if(sig.length) L.push(`${v.length} 題中有 <b>${sig.length} 題</b>達統計顯著進步，進步最多的是「${[...sig].sort((a,b)=>d(b)-d(a))[0].k}」（+${fmt(d([...sig].sort((a,b)=>d(b)-d(a))[0]))}）。`);
    const ceil=ns.filter(s=>s.pre>=4);
    if(ceil.length) L.push(`${ceil.map(s=>`「${s.k}」`).join('、')}課前已達 4 分以上，變化不明顯屬天花板效應，並非課程無效。`);
    const other=ns.filter(s=>s.pre<4);
    if(other.length) L.push(`${other.map(s=>`「${s.k}」`).join('、')}尚未達顯著進步，可檢視課程中該主題的練習時間或教學方式。`);
  }else{
    const best=[...v].sort((a,b)=>d(b)-d(a))[0];
    L.push(`以全部填答者比較（未配對），進步最多的是「${best.k}」（+${fmt(d(best))}）。全部填答包含只填一次的學員，僅供參考，正式成效請以「僅配對」為準。`);
  }
  const low=v.filter(s=>s.post<3.5); if(low.length) L.push(`課後仍低於 3.5 分：${low.map(s=>`「${s.k}」`).join('、')}，建議列為後續追蹤或補強項目。`);
  const dn=v.filter(s=>d(s)<-0.05); if(dn.length) L.push(`${dn.map(s=>`「${s.k}」`).join('、')}課後反而下降，可能是上課後更清楚自身不足（自我覺察提升），建議搭配質性回饋判讀。`);
  return insight(L);
}
function insEPA(rows){
  const s=rows.map(r=>{const n=r.dist.reduce((a,b)=>a+b,0);return {label:r.label,n,low:n?(r.dist[0]+r.dist[1])/n:null,hi:n?(r.dist[2]+r.dist[3]+r.dist[4])/n:null,mean:n?r.dist.reduce((a,c,i)=>a+c*(i+1),0)/n:null};}).filter(x=>x.n);
  if(!s.length) return '';
  const L=[];
  if(s.length===2){
    L.push(`L3 以上（VS 隨時支援下可自行處理）的比例由課前 ${pc(s[0].hi)} 變為課後 <b>${pc(s[1].hi)}</b>，平均等級 L${fmt(s[0].mean,1)} → L${fmt(s[1].mean,1)}。`);
    L.push(s[1].low>=.5?`課後仍有 ${pc(s[1].low)} 學員自評需 VS 在旁監督或僅能旁觀，臨床值班時宜安排足夠的上級支援。`:`課後多數學員已自評可在支援下處理，信任程度有明顯提升。`);
  }else{
    const x=s[0];
    L.push(`平均信任等級 <b>L${fmt(x.mean,1)}</b>；${pc(x.hi)} 學員自評達 L3 以上，${pc(x.low)} 自評仍需 VS 在旁監督或僅能旁觀。`);
    L.push(x.low>=.5?'多數學員仍需近身監督，臨床執行時建議由上級醫師陪同。':'多數學員已具備在支援下處理的信心。');
  }
  return insight(L);
}
function insFb(rs,its){
  if(!rs.length||!its.length) return '';
  const st=its.map(it=>({k:it.k,...itemStat(rs,it)})).filter(s=>s.mean!=null); if(!st.length) return '';
  const m=mean(st.map(s=>s.mean)), t=mean(st.map(s=>s.top2)), lo=[...st].sort((a,b)=>a.mean-b.mean)[0];

}
function insChoice(rs,it){
  const cnt={};it.opts.forEach(o=>cnt[o]=0);rs.forEach(r=>{const v=clean(r.get(it.h));const k=it.opts.find(o=>norm(o)===norm(v));if(k)cnt[k]++;});

  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0], zero=cnt[it.opts[0]]||0;
  return insight([`最多學員落在「${top[0]}」（${pc(top[1]/n)}）。`,zero?`${pc(zero/n)} 學員為「${it.opts[0]}」，${/真實病人/.test(it.h)?'真實臨床插管經驗有限，模擬課程對這群學員特別重要':'模擬練習經驗不足'}。`:'']);
}
function insNum(nv){

function insPersonal(pm,P){

  const up=v.filter(x=>x.b-x.a>0.05), dn=v.filter(x=>x.b-x.a<-0.05), eu=v.filter(x=>x.ea&&x.eb&&x.eb>x.ea).length;
  return insight([`${v.length} 位配對學員中，<b>${up.length} 人</b>自評進步、${v.length-up.length-dn.length} 人持平、${dn.length} 人下降；EPA 等級提升者 ${eu} 人。`,
    dn.length?`自評下降：${dn.map(x=>esc(x.p.post.name)).join('、')}，可個別了解原因（可能是課後更清楚自身不足）。`:'']);

function insSessions(list){
  if(!list.length) return '';
  const st=list.map(s=>({s,t:sStat(s)})), q=st.filter(x=>x.t.need);
  const att=st.reduce((n,x)=>n+x.t.att.length,0), L=[];

  if(q.length){
    const need=q.reduce((n,x)=>n+x.t.need,0),got=q.reduce((n,x)=>n+x.t.got,0);
    L.push(`需填問卷的 ${q.length} 場整體回收率 <b>${pc(got/need)}</b>。`);
    const low=q.filter(x=>x.t.rate<.6);
    if(low.length) L.push(`回收率低於 60% 的場次有 ${low.length} 場${low.length<=4?`（${low.map(x=>`${x.s.date.slice(5).replace('-','/')} ${x.s.course.name} ${pc(x.t.rate)}`).join('、')}）`:''}，建議優先追蹤。`);

}

  return `<div class="hb">${its.map(it=>{const s=itemStat(rs,it);

      <div class="hb-track"><div class="hb-bar" style="width:${(s.mean||0)*20}%${color?';background:'+color:''}" data-tip="${esc(`${it.k}\n平均 ${fmt(s.mean)}（SD ${fmt(s.sd)}），n = ${s.n}\n4–5 分比例 ${s.top2==null?'–':Math.round(s.top2*100)+'%'}\n${distTxt(s.dist)}`)}"></div></div>
      <div class="hb-val"><span class="num">${fmt(s.mean)}</span><span class="p">4–5分 ${s.top2==null?'–':Math.round(s.top2*100)+'%'}</span></div></div>`;}).join('')}</div>${axis()}`;
}
function pairChart(stats){
  if(!stats.length||stats.every(s=>s.pre==null&&s.post==null)) return '<div class="empty">此期間沒有可比較的資料</div>';
  return `<div class="hb">${stats.map(s=>{const d=s.post!=null&&s.pre!=null?s.post-s.pre:null,cls=d==null?'flat':d>0.005?'up':d<-0.005?'down':'flat';
    return `<div class="hb-row"><div class="hb-lab">${esc(s.k)}</div><div class="hb-track">
      <div class="hb-bar pre" style="width:${(s.pre||0)*20}%" data-tip="${esc(`${s.k}｜課前\n平均 ${fmt(s.pre)}${s.n!=null?'，n = '+s.n:''}`)}"></div>
      <div class="hb-bar post" style="width:${(s.post||0)*20}%" data-tip="${esc(`${s.k}｜課後\n平均 ${fmt(s.post)}${s.n!=null?'，n = '+s.n:''}\n${d==null?'':'差異 '+(d>0?'+':'')+fmt(d)} ${pTxt(s.p)}`)}"></div></div>
      <div class="hb-val"><span class="delta ${cls}">${d==null?'–':(d>0?'▲ +':d<0?'▼ ':'')+fmt(d)}</span><span class="p">${pTxt(s.p)}</span></div></div>`;}).join('')}</div>${axis()}`;
}
function stacked(rows){
  if(!rows.some(r=>r.dist.some(x=>x))) return '<div class="empty">此期間沒有資料</div>';
  return `<div class="stk">${rows.map(r=>{const n=r.dist.reduce((a,b)=>a+b,0);
    return `<div class="stk-row"><div class="stk-lab">${esc(r.label)}</div><div class="stk-bar">${r.dist.map((c,i)=>c?`<div style="flex:${c};background:${EPA_COLORS[i]};color:${EPA_INK[i]}" data-tip="${esc(`${r.label}｜Level ${i+1}\n${EPA_DESC[i]}\n${c} 人（${Math.round(c/n*100)}%）`)}">${c/n>=.15?Math.round(c/n*100)+'%':''}</div>`:'').join('')}</div><div class="stk-n">n = ${n}</div></div>`;}).join('')}</div>
    <div class="epa-leg">${EPA_COLORS.map((c,i)=>`<span><i style="background:${c}"></i>L${i+1}　${EPA_DESC[i]}</span>`).join('')}</div>`;
}
function choiceChart(rs,it,color){
  const cnt={};it.opts.forEach(o=>cnt[o]=0);
  rs.forEach(r=>{const v=clean(r.get(it.h)).replace(/\s+/g,' ');const k=it.opts.find(o=>norm(o)===norm(v))||v;if(k)cnt[k]=(cnt[k]||0)+1;});
  const n=Object.values(cnt).reduce((a,b)=>a+b,0),max=Math.max(1,...Object.values(cnt));

/* ---------- tiles ---------- */
function kpi(span,color,l,v,s,unit){return `<div class="tile kpi ${span} ${color||''}"><div class="l">${l}</div><div class="v">${v}${unit?`<small>${unit}</small>`:''}</div>${s?`<div class="s">${s}</div>`:''}</div>`;}
function tileH(no,title,d,extra){return `<div class="tile-h"><div>${no?`<span class="tag-no">${no}</span>`:''}<h3>${title}</h3>${d?`<div class="d">${d}</div>`:''}</div>${extra||''}</div>`;}
function deltaHtml(a,b,p){if(a==null||b==null)return '';const d=b-a,c=d>0.005?'up':d<-0.005?'down':'flat';return `<span class="delta ${c}">${d>0?'▲ +':d<0?'▼ ':''}${fmt(d)}</span>${p!=null?` · ${pTxt(p)}`:''}`;}

/* ---------- pages ---------- */
function render(){
  const tabs=[['overview','總覽'],['track','簽到與回收'],...MODULES.map(m=>[m.key,m.title])];
  if(!tabs.some(t=>t[0]===TAB)) TAB='overview';
  $('#tabs').innerHTML=tabs.map(([k,t],i)=>`<button data-k="${k}" class="${k===TAB?'on':''} ${i%2?'alt':''}">${t}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{TAB=b.dataset.k;ls.set('ems_dash_tab',TAB);render();window.scrollTo({top:0});});
  $('#bExport').textContent = TAB==='overview'?'匯出全部 Excel':TAB==='track'?'匯出追蹤名單 Excel':'匯出本課程 Excel';
  $('#app').innerHTML = `<div class="bento">${TAB==='overview'?pageOverview():TAB==='track'?pageTrack():TAB==='airway'?pageAirway():pageSingle(MODULES.find(m=>m.key===TAB))}</div>`;

/* ---------- 年度累計（以簽到為準） ---------- */
const THIS_YEAR=String(new Date().getFullYear());
function yearStats(courseKey){
  const today=todayStr();
  const ss=SESS.filter(s=>s.course.key===courseKey&&s.date.startsWith(THIS_YEAR)&&s.date<=today);
  const att=ss.flatMap(s=>s.att), st=ss.map(sStat);
  const need=st.reduce((n,t)=>n+t.need,0), got=st.reduce((n,t)=>n+t.got,0);
  return {sessions:ss.length, headcount:att.length, unique:new Set(att.map(a=>a.id||a.name)).size,
    pgy:att.filter(a=>/PGY/i.test(a.unit)).length, ugy:att.filter(a=>/UGY/i.test(a.unit)).length,
    last:ss.map(s=>s.date).sort().pop()||'', rate:need?got/need:null, got, need};
}
const ytdLabel=()=>`${THIS_YEAR} 年至今（統計至 ${todayStr().slice(5).replace('-','/')}）`;
function moduleHero(courseKey){
  const y=yearStats(courseKey);
  return `<div class="tile hero-tile navy t-4"><div class="l">${ytdLabel()}</div><div class="hero-big num">${y.sessions}<small>場</small></div><div class="hero-cap">已開課場次${y.last?`　最近一場 ${y.last.slice(5).replace('-','/')}`:''}</div></div>
    <div class="tile hero-tile red t-4"><div class="l">${ytdLabel()}</div><div class="hero-big num">${y.headcount}<small>人次</small></div><div class="hero-cap">訓練人次　PGY ${y.pgy}／UGY ${y.ugy}</div></div>
    <div class="tile hero-tile cream t-4"><div class="l">${ytdLabel()}</div><div class="hero-big num">${y.rate==null?'–':Math.round(y.rate*100)}<small>${y.rate==null?'':'%'}</small></div><div class="hero-cap">問卷回收率${y.need?`　${y.got}／${y.need} 份`:'　（本課程不需問卷）'}　·　不重複學員 ${y.unique} 人</div></div>`;
}

// 質性回饋不顯示姓名，只顯示職稱（PGY1／PGY2／UGY）
function roleOf(r){
  if(/^PGY/i.test(r.rank)) return r.rank.toUpperCase();
  const c=CHK.find(x=>(r.id&&x.id===r.id)||(r.name&&x.name===r.name));
  if(c&&/UGY/i.test(c.unit)) return 'UGY';
  if(c&&/PGY/i.test(c.unit)) return 'PGY';
  return r.rank||'學員';
}
function qualTile(fk,no,title){
  const f=F[fk],ts=items(f,'text'),rs=recs(fk); if(!ts.length) return '';
  const blocks=ts.map((it,qi)=>{
    const ans=rs.map(r=>({r,v:clean(r.get(it.h))})).filter(x=>x.v&&!isBlank(x.v)).sort((a,b)=>a.r.time<b.r.time?1:-1);
    const th={}; ans.forEach(x=>themesOf(x.v).forEach(t=>th[t]=(th[t]||0)+1));
    const top=Object.entries(th).sort((a,b)=>b[1]-a[1]).slice(0,4);
    const q=disp(it.h).replace(/^\((有關反思|有關課程|反思與回饋)\)\s*/,'');
    return {qi,q,ans,top,blank:rs.filter(r=>{const v=clean(r.get(it.h));return !v||isBlank(v);}).length};
  });
  const allTh={}; blocks.forEach(b=>b.ans.forEach(x=>themesOf(x.v).forEach(t=>allTh[t]=(allTh[t]||0)+1)));
  const allTop=Object.entries(allTh).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const totalAns=blocks.reduce((n,b)=>n+b.ans.length,0);
  return `<div class="tile t-12">${tileH(no,title,`共 ${ts.length} 題、${totalAns} 則有效回覆（已略過「無」等空白回覆）；標示色塊為系統偵測的主題關鍵詞`)}
    ${blocks.map(b=>`<details class="qblock" open><summary><span class="qno">Q${b.qi+1}</span><span class="qtx">${esc(b.q)}</span><span class="qmeta">${b.ans.length} 則</span></summary>
      ${b.top.length?`<div class="qthemes">常見主題：${b.top.map(([t,c])=>`<span class="chip ok">${t} ${c}</span>`).join(' ')}</div>`:''}
      <div class="quotes">${b.ans.length?b.ans.map(x=>`<div class="quote"><div class="txt">${markKw(x.v)}</div><div class="who">${esc(roleOf(x.r))}<span>${x.r.date}</span></div></div>`).join(''):'<div class="empty">此期間沒有回覆</div>'}</div>
      ${b.ans.length?insight([`${b.ans.length} 則回覆${b.top.length?`，最常提到「${b.top[0][0]}」（${b.top[0][1]} 則${b.top[1]?`）與「${b.top[1][0]}」（${b.top[1][1]} 則`:''}）`:''}。`,b.blank?`另有 ${b.blank} 位學員未作答或填「無」。`:'']):''}
    </details>`).join('')}
    ${allTop.length?insight([`綜合所有題目，學員最常提及的主題為 ${allTop.map(([t,c])=>`「${t}」（${c} 則）`).join('、')}。`,
      allTh['實作練習']?'學員普遍重視動手練習與情境模擬，建議保留或增加實作時間。':'',
      allTh['情緒自信']?'有學員提到緊張、壓力或自信議題，可在課程中加入臨場壓力情境與心理準備的引導。':'',
      allTh['流程步驟']?'流程與步驟是常見的「想加強」項目，可提供流程圖或口袋卡協助記憶。':'']):''}
  </div>`;
}
function recordsTile(fks,no){
  const key=fks.join(','),cur=UI.recForm[key]&&fks.includes(UI.recForm[key])?UI.recForm[key]:fks[0],f=F[cur];
  const q=(UI.recSearch[key]||'').toLowerCase();
  const rs=recs(cur).filter(r=>!q||(r.name+r.id).toLowerCase().includes(q)).sort((a,b)=>a.time<b.time?1:-1);
  const se=selfItems(f),fb=fbItems(f),ei=epaItem(f);
  return `<div class="tile t-12">${tileH(no,'填答紀錄','點選任一列可查看完整作答')}<div class="tbl-tools">
    ${fks.length>1?`<div class="seg" data-recseg="${key}">${fks.map((k,i)=>`<button data-v="${k}" class="${k===cur?'on':''} ${i?'alt':''}">${k==='airway_pre'?'課前':'課後'}</button>`).join('')}</div>`:''}
    <input type="search" placeholder="搜尋姓名或人事號" data-recq="${key}" value="${esc(UI.recSearch[key]||'')}"><span class="upd">${rs.length} 筆</span></div>
    ${rs.length?`<div class="tbl-scroll"><table><thead><tr><th>填答時間</th><th>姓名</th><th>人事號</th><th>職級</th><th class="r">${f.key==='sim_airway'?'滿意度':'自評'}平均</th>${fb.length?'<th class="r">回饋平均</th>':''}<th class="c">EPA</th></tr></thead><tbody>
    ${rs.map(r=>`<tr class="click" data-rec="${cur}|${DATA[cur].indexOf(r)}"><td class="num">${esc(r.time.slice(0,16))}</td><td>${esc(r.name)}</td><td class="num">${esc(r.id)}</td><td>${esc(r.rank)}</td><td class="r num">${fmt(recMean(r,se))}</td>${fb.length?`<td class="r num">${fmt(recMean(r,fb))}</td>`:''}<td class="c num">${epa(r.get(ei.h))?'L'+epa(r.get(ei.h)):'–'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">此期間沒有資料</div>'}</div>`;
}
function showRecord(fk,i){
  const f=F[fk],r=DATA[fk][i];let n=0;const rows=[];
  if(f.month) rows.push(['',disp(f.month),r.get(f.month)]);
  f.sections.forEach(s=>s.items.forEach(it=>{n++;rows.push([String(n).padStart(2,'0'),disp(it.h),r.get(it.h)]);}));
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="modal-box"><div class="modal-h"><div><b>${esc(r.name)}（${esc(r.id)}）</b><span>${esc(modName(f))}${fk.startsWith('airway')?'｜'+(fk==='airway_pre'?'課前':'課後'):''} · ${esc(r.rank)} · ${esc(r.time)}</span></div><button aria-label="關閉">×</button></div>
    <div class="modal-b">${rows.map(([no,q,a])=>`<div class="qa"><span class="n">${no}</span><span class="q">${esc(q)}</span><span class="a">${esc(clean(a))||'<span style="color:var(--muted)">（未填）</span>'}</span></div>`).join('')}</div></div>`;
  m.onclick=e=>{if(e.target===m||e.target.closest('.modal-h button'))m.remove();};
  document.body.appendChild(m);
}
function bindPage(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.tcourse){UI.tcourse=b.dataset.tcourse;UI.sess=null;}TAB=b.dataset.go;ls.set('ems_dash_tab',TAB);render();window.scrollTo({top:0});});
  const ps=$('#pairSeg');if(ps)ps.querySelectorAll('button').forEach(b=>b.onclick=()=>{UI.pairOnly=b.dataset.v==='1';const y=scrollY;render();scrollTo(0,y);});
  document.querySelectorAll('.qsel').forEach(s=>s.onchange=()=>{UI.qSel[s.dataset.q]=+s.value;const y=scrollY;render();scrollTo(0,y);});
  document.querySelectorAll('[data-recseg]').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{UI.recForm[seg.dataset.recseg]=b.dataset.v;const y=scrollY;render();scrollTo(0,y);}));
  document.querySelectorAll('[data-recq]').forEach(inp=>inp.oninput=()=>{UI.recSearch[inp.dataset.recq]=inp.value;const y=scrollY,pos=inp.selectionStart;render();scrollTo(0,y);const n=document.querySelector(`[data-recq="${inp.dataset.recq}"]`);n.focus();n.setSelectionRange(pos,pos);});
  document.querySelectorAll('[data-rec]').forEach(tr=>tr.onclick=()=>{const [fk,i]=tr.dataset.rec.split('|');showRecord(fk,+i);});
  bindTrack();
}

/* ---------- Excel export ---------- */
function rawSheet(fk){const f=F[fk],hs=['ID','開始時間','完成時間','姓名','人事號','職級',...(f.month?[f.month]:[]),...items(f).map(it=>it.h)];const aoa=[hs.map(disp)];recs(fk).forEach(r=>aoa.push(hs.map(h=>{const v=r.get(h);return typeof v==='string'?clean(v):v;})));return XLSX.utils.aoa_to_sheet(aoa);}
function statSheet(fk){
  const f=F[fk],rs=recs(fk),aoa=[['向度','題目','簡稱','n','平均','標準差','4–5分比例','1分','2分','3分','4分','5分']];
  items(f,'likert').forEach(it=>{const s=itemStat(rs,it);aoa.push([it.sec,disp(it.h),it.k,s.n,s.mean==null?'':+s.mean.toFixed(2),s.sd==null?'':+s.sd.toFixed(2),s.top2==null?'':+(s.top2*100).toFixed(1)+'%',...s.dist]);});
  const e=epaStat(rs,f);aoa.push([]);aoa.push(['EPA 信任程度','','','n','平均','','','Level 1','Level 2','Level 3','Level 4','Level 5']);
  aoa.push(['EPA',disp(epaItem(f).h),'',e.n,e.mean==null?'':+e.mean.toFixed(2),'','',...e.dist]);
  return XLSX.utils.aoa_to_sheet(aoa);
}
function qualSheet(fk){const f=F[fk],aoa=[['填答時間','姓名','人事號','題目','回覆']];recs(fk).forEach(r=>items(f,'text').forEach(it=>{const v=clean(r.get(it.h));if(v)aoa.push([r.time,r.name,r.id,disp(it.h),v]);}));return XLSX.utils.aoa_to_sheet(aoa);}
function pairSheets(){
  const P=pairs(),fp=F.airway_pre,fq=F.airway_post,a=selfItems(fp),b=selfItems(fq);
  const aoa=[['姓名','人事號','職級','課前日期','課後日期',...a.flatMap(it=>[it.k+'_前',it.k+'_後']),'自評平均_前','自評平均_後','差異','EPA_前','EPA_後']];
  P.forEach(p=>{const x=recMean(p.pre,a),y=recMean(p.post,b);aoa.push([p.post.name,p.id,p.post.rank,p.pre.date,p.post.date,...a.flatMap((it,i)=>[score(p.pre.get(it.h)),score(p.post.get(b[i].h))]),x==null?'':+x.toFixed(2),y==null?'':+y.toFixed(2),x!=null&&y!=null?+(y-x).toFixed(2):'',epa(p.pre.get(epaItem(fp).h)),epa(p.post.get(epaItem(fq).h))]);});
  const st=[['題目','配對 n','課前平均','課後平均','差異','t','p']];
  pairedItemStats().forEach(s=>st.push([s.k,s.n,s.pre==null?'':+s.pre.toFixed(2),s.post==null?'':+s.post.toFixed(2),s.pre!=null&&s.post!=null?+(s.post-s.pre).toFixed(2):'',s.t==null?'':+s.t.toFixed(3),s.p==null?'':s.p<0.0001?'<0.0001':+s.p.toFixed(4)]));
  return [XLSX.utils.aoa_to_sheet(aoa),XLSX.utils.aoa_to_sheet(st)];
}
function filterNote(){const a=$('#fFrom').value,b=$('#fTo').value,r=$('#fRank').value;return (a||b?`_${a||'起'}至${b||'今'}`:'')+(r?`_${r}`:'');}
function exportExcel(){
  if(!RAW) return;
  if(typeof XLSX==='undefined'){alert('Excel 元件尚未載入，請確認網路後重新整理');return;}
  const wb=XLSX.utils.book_new(),add=(ws,n)=>XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31));
  const today=new Date().toISOString().slice(0,10).replace(/-/g,'');let name;
  if(TAB==='track'){
    trackSheets().forEach(([a,n])=>add(XLSX.utils.aoa_to_sheet(a),n));
    name=`簽到與問卷回收追蹤${filterNote()}_${today}.xlsx`;
  }else if(TAB==='overview'){
    const ov=[['課程','問卷','填答份數','自評／滿意度平均','EPA 平均']];
    FORMS.forEach(f=>{const rs=recs(f.key);ov.push([modName(f),f.title+(f.key.startsWith('airway')?'（'+f.tag+'）':''),rs.length,+(mean(rs.map(r=>recMean(r,selfItems(f))).filter(x=>x!=null))||0).toFixed(2),+(epaStat(rs,f).mean||0).toFixed(2)]);});
    add(XLSX.utils.aoa_to_sheet(ov),'總覽');
    const [ps,pst]=pairSheets();add(pst,'呼吸道_前後測統計');add(ps,'呼吸道_個人配對');
    trackSheets().slice(0,2).forEach(([a,n])=>add(XLSX.utils.aoa_to_sheet(a),n));
    FORMS.forEach(f=>{add(rawSheet(f.key),f.sheet+'_紀錄');add(statSheet(f.key),f.sheet+'_統計');});
    name=`急救模組問卷_全部${filterNote()}_${today}.xlsx`;
  }else if(TAB==='airway'){
    const [ps,pst]=pairSheets();add(pst,'前後測統計');add(ps,'個人配對');
    add(statSheet('airway_pre'),'課前_題目統計');add(statSheet('airway_post'),'課後_題目統計');
    add(rawSheet('airway_pre'),'課前_填答紀錄');add(rawSheet('airway_post'),'課後_填答紀錄');add(qualSheet('airway_post'),'課後_質性回饋');
    name=`急性呼吸道處置_前後測${filterNote()}_${today}.xlsx`;
  }else{
    const fk=MODULES.find(m=>m.key===TAB).forms[0];
    add(statSheet(fk),'題目統計');add(rawSheet(fk),'填答紀錄');add(qualSheet(fk),'質性回饋');
    name=`${F[fk].sheet}${filterNote()}_${today}.xlsx`;
  }
  XLSX.writeFile(wb,name);
}

/* ---------- boot ---------- */
['#fFrom','#fTo','#fRank'].forEach(s=>$(s).addEventListener('change',()=>RAW&&render()));
$('#bReload').onclick=load;$('#bPrint').onclick=()=>window.print();$('#bExport').onclick=exportExcel;
load();
</script>
