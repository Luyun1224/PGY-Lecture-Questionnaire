<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>急救模組課程簽到</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#8E1620; --red-d:#6B0F18; --red-l:#F7E1DF;
  --ink:#1A1414; --paper:#F6EDDC; --card:#FFFCF6; --cream:#FFF5E4; --yellow:#F5D547; --yellow-l:#FCEBA6;
  --line:#1A1414; --soft:#E8DCC6; --muted:#6B5E58; --ok:#1F7A4D; --warn:#C21F2C;
  --sh:4px 4px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper) radial-gradient(rgba(26,20,20,.10) 1px,transparent 1.3px) 0 0/18px 18px;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6;font-size:15.5px}
button{font-family:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ===== Poster header ===== */
.poster{background:var(--red) radial-gradient(rgba(0,0,0,.16) 1px,transparent 1.3px) 0 0/14px 14px;color:#fff;border-bottom:3px solid var(--ink);overflow:hidden}
.poster-in{max-width:760px;margin:0 auto;padding:22px 16px 26px;display:grid;grid-template-columns:1fr 250px;gap:8px 18px;align-items:center}
.poster-txt{min-width:0}
.poster-art{position:relative;height:270px}
.poster-art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.kicker{display:flex;align-items:center;gap:8px;font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.2em;font-size:13px;text-transform:uppercase;color:var(--ink);padding-bottom:8px;border-bottom:2.5px solid var(--ink);margin-bottom:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kicker svg{flex:none}
.kicker span{overflow:hidden;text-overflow:ellipsis}
.kicker b{font-family:"Noto Sans TC",sans-serif;font-weight:900;letter-spacing:.06em}
.poster-title{font-weight:900;color:#fff;font-size:clamp(28px,7.4vw,38px);line-height:1.18;letter-spacing:.02em;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.tagline{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin-top:16px}
.meta-tag{display:inline-block;font-weight:900;font-size:14px;color:var(--ink);background:var(--yellow);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:2px 12px;white-space:nowrap;transform:rotate(-3deg)}
.meta-tag:empty{display:none}
.slogan{font-weight:900;font-size:clamp(17px,4.4vw,21px);color:var(--ink);letter-spacing:.04em}
.lead{color:#FFE9E6;font-size:14px;font-weight:500;padding:12px 0 0}
.lead:empty{display:none}

/* ===== Progress ===== */
.progress{position:sticky;top:0;z-index:20;background:rgba(246,237,220,.96);backdrop-filter:blur(6px);border-bottom:2.5px solid var(--ink)}
.progress .wrap{display:flex;align-items:center;gap:12px;height:46px}
.bar{flex:1;height:12px;background:var(--card);border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .25s}
.progress span{font-family:"Barlow Condensed",sans-serif;font-size:16px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.progress b{font-size:13px;color:var(--ink);font-weight:700;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== Sections & cards ===== */
main.wrap{padding:8px 16px 40px}
.sec-h{display:flex;align-items:center;gap:10px;margin:30px 0 14px}
.sec-h .no{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;color:var(--yellow);background:var(--ink);line-height:1;padding:5px 8px 4px}
.sec-h h2{font-size:19px;font-weight:900;color:var(--ink);letter-spacing:.04em}
.sec-h::after{content:"";flex:1;height:2.5px;background:var(--ink)}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:6px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.card.missing{border-color:var(--warn);box-shadow:4px 4px 0 var(--warn)}
.q{display:grid;grid-template-columns:34px 1fr;column-gap:8px}
.q .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;color:var(--red);line-height:1.5}
.q .t{font-weight:500;font-size:15.5px}
.q .t .chip{display:inline-block;font-size:12px;font-weight:900;color:var(--ink);background:var(--yellow);border:1.5px solid var(--ink);padding:0 7px;margin-right:6px;vertical-align:1px}
.q .t .opt{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.q .t .req{color:var(--red);margin-left:3px}
.ans{grid-column:2;margin-top:12px}
.hint{grid-column:2;font-size:12.5px;font-weight:700;color:var(--warn);margin-top:8px;display:none}
.card.missing .hint{display:block}

/* Likert */
.lik{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lik button{border:2px solid var(--ink);background:var(--cream);border-radius:6px;padding:8px 2px 7px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;transition:all .12s}
.lik button .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;line-height:1}
.lik button .l{font-size:11.5px;line-height:1.25;color:var(--muted);text-align:center;word-break:keep-all}
.lik button:hover{background:var(--yellow-l)}
.lik button.on{background:var(--red);color:#fff;box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.lik button.on .l{color:#FFDCD8}

/* EPA & choice */
.epa{display:grid;gap:7px}
.epa button{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:8px;text-align:left;border:2px solid var(--ink);background:var(--cream);border-radius:6px;padding:10px 12px;cursor:pointer;font-size:14.5px;color:var(--ink);transition:all .12s}
.epa button .lv{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;color:var(--red);letter-spacing:.04em}
.epa button:hover{background:var(--yellow-l)}
.epa button.on{background:var(--red);color:#fff;box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.epa button.on .lv{color:var(--yellow)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{border:2px solid var(--ink);background:var(--cream);border-radius:999px;padding:6px 16px;font-size:14.5px;font-weight:500;cursor:pointer;color:var(--ink);transition:all .12s}
.pills button:hover{background:var(--yellow-l)}
.pills button.on{background:var(--ink);color:#fff;font-weight:700;box-shadow:2px 2px 0 var(--red)}

/* inputs */
textarea,input[type=text],input[type=number]{width:100%;border:2px solid var(--ink);border-radius:6px;background:#fff;padding:10px 12px;font:inherit;font-size:15px;color:var(--ink);outline:none;transition:box-shadow .12s}
textarea{min-height:84px;resize:vertical;line-height:1.6}
textarea:focus,input:focus{box-shadow:3px 3px 0 var(--red)}
.num{display:flex;align-items:center;gap:8px;max-width:180px}
.num span{color:var(--muted)}
.idgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.field label{display:block;font-size:13.5px;font-weight:900;color:var(--ink);margin-bottom:6px}
.field label .req{color:var(--red);margin-left:3px}
.field.full{grid-column:1/-1}
.field.missing input,.field.missing .pills button{border-color:var(--warn)}
.remember{grid-column:1/-1;font-size:12.5px;color:var(--muted)}

/* submit */
.submit{margin-top:26px;display:grid;gap:12px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:2.5px solid var(--ink);border-radius:6px;padding:14px 20px;font-size:16.5px;font-weight:900;cursor:pointer;letter-spacing:.08em;box-shadow:var(--sh);transition:transform .1s,box-shadow .1s,background .15s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-d)}
.btn-red:disabled{background:#A99592;cursor:wait}
.btn-line{background:#fff;color:var(--ink)}
.btn-line:hover{background:var(--yellow-l)}
.err{font-size:13.5px;font-weight:700;color:var(--warn);text-align:center;min-height:20px}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* course picker */
.pick{display:grid;gap:12px;margin-top:6px}
.pick button{display:grid;grid-template-columns:44px 1fr 20px;align-items:center;gap:12px;text-align:left;background:var(--card);border:2.5px solid var(--ink);border-radius:6px;padding:16px;cursor:pointer;color:var(--ink);box-shadow:var(--sh);transition:transform .12s,box-shadow .12s,background .12s}
.pick button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);background:#fff}
.pick .idx{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;color:var(--red);line-height:1}
.pick .nm{font-weight:900;font-size:16px;color:var(--ink)}
.pick .ds{font-size:13px;color:var(--muted)}
.pick .ar{color:var(--red);font-weight:900;font-size:20px}
.pick.pair{grid-template-columns:1fr 1fr}
.pick.pair button{grid-template-columns:1fr 20px;align-items:start}
.pick.pair .ar{align-self:center}
.pick .when{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.16em;font-size:12px;color:var(--ink);background:var(--yellow);padding:0 6px}
.pick.pair .nm{font-size:18px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:2.5px solid var(--ink);border-radius:6px;box-shadow:var(--sh);padding:12px 16px;margin-top:22px}
.switch .cur{font-size:13px;color:var(--muted)}
.switch .cur b{display:block;font-size:15.5px;font-weight:900;color:var(--ink)}
.switch button{flex:none;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:900;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}

/* done */
.done{text-align:center;padding:40px 8px}
.done .mark{width:72px;height:72px;border-radius:50%;background:var(--red);border:3px solid var(--ink);box-shadow:var(--sh);margin:0 auto 20px;display:grid;place-items:center}
.done h2{font-size:26px;font-weight:900;color:var(--red);margin-bottom:6px}
.done p{color:var(--muted);font-size:14.5px}
.done .actions{display:grid;gap:10px;max-width:320px;margin:24px auto 0}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:8px 0 28px}
.foot b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.32em;font-size:13px;color:var(--ink);margin-bottom:2px}
.hide{display:none!important}

@media (max-width:640px){
  .poster-in{grid-template-columns:1fr;padding-top:14px}
  .poster-art{order:-1;height:170px;margin:0 -8px}
}
@media (max-width:420px){
  .card{padding:16px 14px}
  .q{grid-template-columns:28px 1fr;column-gap:6px}
  .ans,.hint{grid-column:1/-1}
  .lik{gap:4px}
  .lik button .l{font-size:10.5px}
  .idgrid{grid-template-columns:1fr}
  .epa button{grid-template-columns:56px 1fr;font-size:14px}
}

.pick button{grid-template-columns:44px 1fr 22px}
.pick button.on{background:var(--yellow-l);box-shadow:var(--sh)}
.pick button .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);background:#fff;justify-self:end}
.pick button.on .ck{background:var(--red);box-shadow:inset 0 0 0 3px #fff}
.pick button .nm{font-size:15px}
.field.missing .pick button{border-color:var(--warn)}
.qlink{display:grid;grid-template-columns:44px 1fr 20px;align-items:center;gap:12px;background:var(--card);border:2.5px solid var(--ink);border-radius:6px;box-shadow:var(--sh);padding:16px;color:var(--ink);text-decoration:none;transition:transform .12s,box-shadow .12s,background .12s}
.qlink:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);background:var(--yellow-l)}
.qlink .idx{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;color:var(--red);line-height:1}
.qlink .nm{font-weight:900;font-size:16px;color:var(--ink)}
.qlink .ds{font-size:13px;color:var(--muted)}
.qlink .ar{color:var(--red);font-weight:900;font-size:20px}
.done{padding:32px 8px 8px}
main .lead{color:var(--muted);padding-top:16px}
input[type=date]{width:100%;border:2px solid var(--ink);border-radius:6px;background:#fff;padding:9px 12px;font:inherit;font-size:15px;color:var(--ink);outline:none}
input[type=date]:focus{box-shadow:3px 3px 0 var(--red)}
.field.missing input[type=date]{border-color:var(--warn)}
</style>
</head>
<body>
<header class="poster"><div class="poster-in">
  <div class="poster-txt">
    <div class="kicker"><svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M1.5 1v14" stroke="#1A1414" stroke-width="2.6"/><path d="M3 1h10l-3 4 3 4H3z" fill="#1A1414"/></svg><span>CHIMEI · PGY EMERGENCY MODULE / <b>急救模組・全員出動</b></span></div>
    <h1 class="poster-title">急救模組課程<br>簽到處</h1>
    <div class="tagline"><span class="meta-tag">課程簽到</span><span class="slogan">報到集合，準備上場。</span></div>
    <p class="lead">請於上課當天簽到，簽到完成後可直接進入該課程的問卷。</p>
  </div>
  <div class="poster-art"><svg id="art" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg></div>
</div></header>
<main class="wrap" id="app"></main>
<div class="foot"><b>ONE TEAM. ONE PULSE.</b>奇美醫院教學部臨床技能中心．一般內科．急診醫學部</div>
<script>
/* ★ GAS 網頁應用程式網址 ★ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbydvnST-K9sQ3l3jgDMtX0Rg9uEjNgqOmPf_HCrMQMrLtBSzBhuQg0r5JNHBrSp7w9Mng/exec';

const COURSES = [
  {key:'airway', topic:'急性呼吸道處置課程', name:'急性呼吸道處置課程', links:[{label:'課前問卷',href:'airway.html?c=airway_pre',note:'上課前填寫'},{label:'課後問卷',href:'airway.html?c=airway_post',note:'上完課再填'}]},
  {key:'sim_airway', topic:'呼吸道擬真練習1.0', name:'呼吸道擬真練習 1.0', links:[{label:'課程回饋表',href:'course-survey.html?c=sim_airway',note:'上完課填寫'}]},
  {key:'trm', topic:'急救團隊演練TRM(含高級心臟救命術ACLS)', name:'急救團隊演練 TRM（含 ACLS）', links:[{label:'TRM 自我評估問卷',href:'course-survey.html?c=trm',note:'上完課填寫'}]},
  {key:'shock', topic:'休克處置', name:'休克處置', links:[{label:'休克處置評估問卷',href:'course-survey.html?c=shock',note:'上完課填寫'}]},
  {key:'cvc', topic:'中央靜脈導管CVC置放(含超音波導引練習)', name:'中央靜脈導管 CVC 置放（含超音波導引練習）', links:[{label:'CVC 技能自我評估問卷',href:'course-survey.html?c=cvc',note:'上完課填寫'}]},
  {key:'concept', topic:'急救概念課', name:'急救概念課', links:[]}
];
const UNITS = ['4240一般科(PGY)','4200教學部(UGY)'];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
let st={}, startTime=new Date().toISOString();

/* ---------- poster art: rescue monitor sailing on waves ---------- */
(function art(){
  const svg=$('#art'), ns='http://www.w3.org/2000/svg';
  const el=(tag,at)=>{const e=document.createElementNS(ns,tag);for(const k in at)e.setAttribute(k,at[k]);svg.appendChild(e);return e;};
  const INK='#1A1414', CREAM='#FFF5E4', RED='#8E1620', YEL='#F5D547';
  // radar rings
  [70,110,150].forEach(r=>el('circle',{cx:205,cy:150,r,fill:'none',stroke:'rgba(255,245,228,.22)','stroke-width':1.5}));
  // plus marks
  [[30,40,9],[372,232,6]].forEach(([x,y,s])=>el('path',{d:`M${x-s} ${y}h${2*s}M${x} ${y-s}v${2*s}`,stroke:CREAM,'stroke-width':3,'stroke-linecap':'round'}));
  // dashed route
  el('path',{d:'M8 268 C40 210 70 220 96 196',fill:'none',stroke:INK,'stroke-width':3,'stroke-dasharray':'8 7'});
  el('path',{d:'M300 66 C320 40 300 22 330 14',fill:'none',stroke:INK,'stroke-width':3,'stroke-dasharray':'8 7'});
  el('circle',{cx:334,cy:12,r:7,fill:CREAM,stroke:INK,'stroke-width':3});
  // monitor: hard shadow + body + screen + ECG
  el('rect',{x:104,y:78,width:196,height:136,rx:10,fill:INK});
  el('rect',{x:94,y:68,width:196,height:136,rx:10,fill:CREAM,stroke:INK,'stroke-width':5});
  el('rect',{x:110,y:84,width:164,height:86,rx:4,fill:INK});
  el('path',{d:'M116 132 H150 L158 120 L166 132 H176 L186 98 L198 158 L208 122 L216 132 H268',fill:'none',stroke:YEL,'stroke-width':4,'stroke-linejoin':'round','stroke-linecap':'round'});
  [[118,190],[136,190]].forEach(([x,y])=>el('rect',{x,y:y-6,width:12,height:6,fill:INK}));
  el('circle',{cx:262,cy:187,r:7,fill:RED,stroke:INK,'stroke-width':3});
  // flag on the monitor
  el('path',{d:'M250 68 V22',stroke:INK,'stroke-width':5,'stroke-linecap':'round'});
  el('path',{d:'M252 22 L292 34 L252 46 Z',fill:INK});
  el('path',{d:'M262 30 l6 4 l-6 4',fill:'none',stroke:CREAM,'stroke-width':2.4,'stroke-linecap':'round','stroke-linejoin':'round'});
  // red-cross badge
  el('circle',{cx:352,cy:96,r:30,fill:CREAM,stroke:INK,'stroke-width':5});
  el('path',{d:'M346 78h12v12h12v12h-12v12h-12v-12h-12v-12h12z',fill:RED,stroke:INK,'stroke-width':2.5,'stroke-linejoin':'round'});
  // waves
  const wave=(y,amp,len)=>{let d=`M-20 ${y}`;for(let x=-20;x<440;x+=len)d+=` q${len/4} ${-amp} ${len/2} 0 t${len/2} 0`;return d;};
  el('path',{d:wave(226,9,60),fill:'none',stroke:CREAM,'stroke-width':5,'stroke-linecap':'round'});
  el('path',{d:wave(250,9,60),fill:'none',stroke:CREAM,'stroke-width':5,'stroke-linecap':'round',opacity:.75});
  el('path',{d:wave(274,9,60),fill:'none',stroke:CREAM,'stroke-width':5,'stroke-linecap':'round',opacity:.5});
  // sticker
  const g=el('g',{transform:'rotate(-6 330 256)'});
  const s=(tag,at,txt)=>{const e=document.createElementNS(ns,tag);for(const k in at)e.setAttribute(k,at[k]);if(txt)e.textContent=txt;g.appendChild(e);};
  s('rect',{x:280,y:226,width:108,height:62,fill:INK});
  s('rect',{x:274,y:220,width:108,height:62,fill:YEL,stroke:INK,'stroke-width':3});
  s('text',{x:328,y:250,'text-anchor':'middle','font-family':'"Noto Sans TC",sans-serif','font-weight':900,'font-size':18,fill:INK},'分秒必爭');
  s('text',{x:328,y:270,'text-anchor':'middle','font-family':'"Barlow Condensed",sans-serif','font-weight':700,'font-size':11,'letter-spacing':2,fill:INK},'ALL HANDS ↗');
})();

function render(){
  const me=store.get('ems_identity')||{};
  const pre=new URLSearchParams(location.search).get('c');
  st={date:today(), course:COURSES.find(c=>c.key===pre)||null, unit:me.unit||''};
  $('#app').innerHTML=`
  <div class="sec-h"><span class="no">01</span><h2>上課資訊</h2></div>
  <div class="card"><div class="idgrid">
    <div class="field full" data-req="date"><label>上課日期<span class="req">*</span></label><input type="date" id="f_date" value="${st.date}" style="max-width:220px"></div>
    <div class="field full" data-req="course"><label>此次課程主題<span class="req">*</span></label>
      <div class="pick" id="courses">${COURSES.map((c,i)=>`<button type="button" data-k="${c.key}"><span class="idx">${String(i+1).padStart(2,'0')}</span><span class="nm">${esc(c.name)}</span><span class="ck"></span></button>`).join('')}</div></div>
  </div></div>
  <div class="sec-h"><span class="no">02</span><h2>學員資料</h2></div>
  <div class="card"><div class="idgrid">
    <div class="field" data-req="name"><label>姓名<span class="req">*</span></label><input type="text" id="f_name" autocomplete="name" value="${esc(me.name||'')}"></div>
    <div class="field" data-req="id"><label>人事號<span class="req">*</span></label><input type="text" id="f_id" autocomplete="off" placeholder="例：B508G7" value="${esc(me.id||'')}"></div>
    <div class="field full" data-req="unit"><label>單位<span class="req">*</span></label><div class="pills" id="units">${UNITS.map(u=>`<button type="button" data-v="${u}" class="${u===st.unit?'on':''}">${u}</button>`).join('')}</div></div>
    <div class="remember">姓名與人事號會記在這台裝置上，填問卷時自動帶入。</div>
  </div></div>
  <div class="submit"><div class="err" id="err"></div><button class="btn btn-red" id="send">簽到</button></div>`;
  const pickCourse=k=>{st.course=COURSES.find(c=>c.key===k);document.querySelectorAll('#courses button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('[data-req="course"]').classList.remove('missing');};
  document.querySelectorAll('#courses button').forEach(b=>b.onclick=()=>pickCourse(b.dataset.k));
  if(st.course) pickCourse(st.course.key);
  document.querySelectorAll('#units button').forEach(b=>b.onclick=()=>{st.unit=b.dataset.v;document.querySelectorAll('#units button').forEach(x=>x.classList.toggle('on',x===b));$('[data-req="unit"]').classList.remove('missing');});
  $('#f_id').addEventListener('input',e=>{const p=e.target.selectionStart;e.target.value=e.target.value.toUpperCase().replace(/\s/g,'');e.target.setSelectionRange(p,p);});
  ['#f_name','#f_id','#f_date'].forEach(s=>$(s).addEventListener('input',e=>e.target.closest('.field').classList.remove('missing')));
  $('#send').onclick=submit;
}
async function submit(){
  const name=$('#f_name').value.trim(), id=$('#f_id').value.trim().toUpperCase(), date=$('#f_date').value;
  const miss=[]; if(!date)miss.push('date'); if(!st.course)miss.push('course'); if(!name)miss.push('name'); if(!id)miss.push('id'); if(!st.unit)miss.push('unit');
  miss.forEach(k=>$(`[data-req="${k}"]`).classList.add('missing'));
  if(miss.length){$('#err').textContent='請完成標示紅框的欄位。';$(`[data-req="${miss[0]}"]`).scrollIntoView({behavior:'smooth',block:'center'});return;}
  if(!/^https:\/\/script\.google\.com\//.test(GAS_URL)){$('#err').textContent='尚未設定 GAS 網址，請聯絡臨床技能中心。';return;}
  const me=store.get('ems_identity')||{}; store.set('ems_identity',{...me,name,id,unit:st.unit});
  const btn=$('#send'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>簽到中…'; $('#err').textContent='';
  try{
    const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({form:'checkin',startTime,answers:{'上課日期':date,'此次課程主題':st.course.topic,'姓名':name,'人事號':id,'單位':st.unit}})});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'簽到失敗');
    done(name,date,j.dup);
  }catch(e){btn.disabled=false;btn.textContent='重新簽到';$('#err').textContent='簽到失敗，請檢查網路後再試一次。（'+e.message+'）';}
}
function done(name,date,dup){
  const c=st.course; window.scrollTo(0,0);
  $('#app').innerHTML=`<div class="done">
    <div class="mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>${dup?'您已經簽到過了':'簽到完成！'}</h2>
    <p>${esc(name)}　${date.replace(/-/g,'/')}<br>${esc(c.name)}</p></div>
    ${c.links.length?`<div class="sec-h"><span class="no">→</span><h2>課程問卷</h2></div>
    <div class="pick">${c.links.map((l,i)=>`<a class="qlink" href="${l.href}"><span class="idx">${String(i+1).padStart(2,'0')}</span><span><span class="nm">${esc(l.label)}</span><br><span class="ds">${esc(l.note)}</span></span><span class="ar">›</span></a>`).join('')}</div>
    <p class="lead" style="text-align:center">問卷是課程完成的一部分，請記得填寫，謝謝！</p>`:`<p class="lead" style="text-align:center">本課程不需填寫問卷，謝謝您的參與！</p>`}
    <div class="submit"><button class="btn btn-line" id="again">幫其他人簽到</button></div>`;
  $('#again').onclick=()=>{try{localStorage.removeItem('ems_identity')}catch(e){}render();};
}
render();
</script>
</body>
</html>
